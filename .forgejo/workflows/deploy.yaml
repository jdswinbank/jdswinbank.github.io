# .forgejo/workflows/deploy.yml
on:
  push:
    branches: [trunk]

jobs:
  deploy:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
